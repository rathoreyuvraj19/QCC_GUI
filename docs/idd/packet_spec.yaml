  - "lru_data_block_state is only confirmed for DATA_DISTRIBUTION (populated) and QCC_STATUS (empty) - QCC_RESET, PRT_BYPASS, SOB_BYPASS, PRT_INTERNAL_GEN, SOB_INTERNAL_GEN, PPS_INTERNAL_GEN, REMOTE_PROGRAMMING are still TBD."
  - "Which GUI command tabs should send which QCC_COMMAND value is a code-level judgment call, not stated directly in the IDD - Dwell/Link Test/Status/RX Cal/TX Cal/Isolation/Soft Reset/Memory Operation are currently all mapped to DATA_DISTRIBUTION (0x00) in core/rc_settings.py on the reasoning that they all deliver a LRU-targeted command via the DMA'd 2880-byte data block; Soft Reset and Memory Operation previously used QCC_RESET(4)/REMOTE_PROGRAMMING(5) under the old mode scheme, which don't have a clean equivalent anymore. Confirm with Yuvraj."
